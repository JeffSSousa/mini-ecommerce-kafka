spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5555/db_payment
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: payment-service


server:
  port: 8082